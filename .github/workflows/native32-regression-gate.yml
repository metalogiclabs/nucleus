name: Nucleus expression identity order candidate and protected replay
on:
  push:
    branches: [research/native32-regression-gate-20261127]
    paths: ['.github/workflows/native32-regression-gate.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.99.1'
      - name: Verify qualified runtime and build isolated expression-order candidate
        run: |
          set -euo pipefail
          mkdir -p evidence-run
          git rev-parse HEAD > evidence-run/commit.txt
          git rev-parse HEAD:src > evidence-run/source-tree.txt
          test "$(git rev-parse HEAD:src)" = 362242c265ee2b1758645c78ad141ad78bf6f8c2
          python3 scripts/verify_source_import.py
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/renovation.rs')
          s=p.read_text()
          def once(a,b):
              global s
              assert s.count(a)==1,(a,s.count(a))
              s=s.replace(a,b)
          once('collections::HashSet, io::','collections::{HashMap, HashSet}, io::')
          marker='fn telescope(exprs: &[Value], mut id: usize)'
          table=r'''// Expression IDs are identities, not stream ordinals. The export
          // may introduce a high-numbered node before a low-numbered one.
          // Keep dependency order independently and never allocate by max ID.
          #[derive(Default)]
          struct ExpressionTable {
              entries: HashMap<usize, (usize, Value)>,
          }
          impl ExpressionTable {
              fn insert(&mut self, id: usize, row: Value) -> Checked<()> {
                  let ordinal = self.entries.len();
                  if self.entries.contains_key(&id) { return Err("duplicate expression ID"); }
                  self.entries.insert(id, (ordinal, row));
                  Ok(())
              }
              fn get(&self, id: usize) -> Option<&Value> {
                  self.entries.get(&id).map(|(_, row)| row)
              }
              fn earlier(&self, child: usize, parent: usize) -> bool {
                  match (self.entries.get(&child), self.entries.get(&parent)) {
                      (Some((c, _)), Some((p, _))) => c < p,
                      _ => false,
                  }
              }
              // Preserve the predecessor's complete-ID-set requirement.
              // Only record order changes; sparse admission is not claimed.
              fn dense(&self) -> bool {
                  self.entries.keys().all(|id| *id < self.entries.len())
              }
          }
          
          '''
          once(marker,table+marker.replace('&[Value]','&ExpressionTable'))
          once('if domain >= id || body >= id {','if !exprs.earlier(domain, id) || !exprs.earlier(body, id) {')
          once('fn contains_family(exprs: &[Value],','fn contains_family(exprs: &ExpressionTable,')
          once('if child >= id { return Err("forward or cyclic expression edge"); }','if !exprs.earlier(child, id) { return Err("forward or cyclic expression edge"); }')
          once('fn check_block(block: &Value, exprs: &[Value],','fn check_block(block: &Value, exprs: &ExpressionTable,')
          once('let mut exprs = Vec::<Value>::new();','let mut exprs = ExpressionTable::default();')
          once('if integer(n)? != exprs.len() { return Err("nonconsecutive expression IDs"); }\n            exprs.push(row);','let id = integer(n)?;\n            exprs.insert(id, row)?;')
          once('    if whole_export.as_ref().is_some_and(|rows| nullary::admits(rows)) {','    if !exprs.dense() { return Err("missing expression IDs"); }\n    // Whole-export admission remains unchanged, including strict table checks.\n    if whole_export.as_ref().is_some_and(|rows| nullary::admits(rows)) {')
          marker='    #[test]\n    fn no_warrant_from_empty_or_malformed_new_input()'
          tests=r'''    #[test]
              fn expression_identity_and_dependency_order_are_distinct() {
                  let mut t = ExpressionTable::default();
                  let sort = |id:usize| serde_json::json!({"ie":id,"sort":0});
                  t.insert(2,sort(2)).unwrap();
                  t.insert(1,sort(1)).unwrap();
                  t.insert(0,serde_json::json!({"ie":0,"forallE":{"type":2,"body":1}})).unwrap();
                  assert!(t.dense());
                  assert!(t.earlier(2,0));
                  assert!(!t.earlier(0,2));
                  assert!(!t.earlier(2,2));
                  assert!(telescope(&t,0).is_ok());
                  assert!(t.insert(2,sort(2)).is_err());
                  let mut forward = ExpressionTable::default();
                  forward.insert(0,serde_json::json!({"ie":0,"forallE":{"type":2,"body":1}})).unwrap();
                  forward.insert(2,sort(2)).unwrap();
                  forward.insert(1,sort(1)).unwrap();
                  assert!(telescope(&forward,0).is_err());
              }
              #[test]
              fn unordered_table_is_not_admission_authority() {
                  let input = b"{\"ie\":1,\"sort\":0}\n{\"ie\":0,\"sort\":0}\n";
                  assert_eq!(check(std::io::Cursor::new(input),true),Ok(Outcome::Unknown));
                  let dup = b"{\"ie\":0,\"sort\":0}\n{\"ie\":0,\"sort\":0}\n";
                  assert!(check(std::io::Cursor::new(dup),true).is_err());
              }
          '''
          once(marker,tests+marker)
          p.write_text(s)
          PY
          git diff --exit-code -- . ':!src/renovation.rs'
          git diff -- src/renovation.rs > evidence-run/expr-order-candidate.patch
          git add src/renovation.rs
          git write-tree > evidence-run/candidate-tree.txt
          git rev-parse :src/renovation.rs > evidence-run/candidate-blob.txt
          python3 scripts/test.py
          python3 -m unittest discover -s tests_py
          cargo build --locked --release --features diagnostics
          sha256sum target/release/metatron-kernel arena.py arena-flags.json > evidence-run/binary-and-launcher.sha256
      - name: Execute original upstream soundness regression bytes
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,pathlib,subprocess,time,urllib.request
          out=pathlib.Path('evidence-run'); inputs=out/'new-inputs'; inputs.mkdir(exist_ok=True)
          G='https://raw.githubusercontent.com/jasisz/gruszka/66e5a93883b91f0cbf2b5f81924c4cdd03b60757/tests/adv/'
          P='https://raw.githubusercontent.com/jasisz/pestka/72162e89e5008ca405646ccebb2c0f685aed1d45/tests/soundness-findings/'
          cases=[
            (G+'good_cases_shape_keeps_ih.ndjson','198628397eb81df34f66f625584f825852209616',0),
            (G+'bad_cases_shape_keeps_ih.ndjson','fb396951a7003d50683267807c4d1290d20157f4',1),
            (G+'bad_nat_log2_by_name_31.ndjson','8733fbe8103b9134d0e6b4de4eb9a00ceb1488a1',1),
            (P+'nat-without-succ-ab.ndjson','35d342e958f879d1e9d272f9b138d51569e00f4b',1)]
          rows=[]
          for url,blob,expected in cases:
              raw=urllib.request.urlopen(url,timeout=30).read()
              assert hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\0'+raw).hexdigest()==blob,url
              name=url.rsplit('/',1)[1]; (inputs/name).write_bytes(raw)
              start=time.monotonic()
              p=subprocess.run(['python3','arena.py'],input=raw,capture_output=True,timeout=120)
              row={'case':name,'source':url,'git_blob':blob,'sha256':hashlib.sha256(raw).hexdigest(),'metadata':json.loads(raw.splitlines()[0]),'expected':expected,'exit':p.returncode,'seconds':round(time.monotonic()-start,6),'stdout':p.stdout.decode(errors='replace'),'stderr':p.stderr.decode(errors='replace')}
              rows.append(row)
              print('NEW_REGRESSION '+json.dumps(row),flush=True)
              (out/'new-regressions.json').write_text(json.dumps(rows,indent=2)+'\n')
          assert len(rows)==4
          # Do not hide incomplete or wrong results; final gate runs after corpus replay.
          PY
      - name: Retrieve immutable native export and official Nucleus receipts
        run: |
          set -euo pipefail
          gh api repos/leanprover/lean-kernel-arena-beta/actions/artifacts/15158040096/zip > evidence-run/test-tarball.zip
          gh api repos/leanprover/lean-kernel-arena-beta/actions/artifacts/15158072357/zip > evidence-run/site-results.zip
          printf '%s  %s\n' 1d0dafccc4d0248f191739751a836b67ceaf491f6b6e70410a3a52e5df690d4d evidence-run/test-tarball.zip bf8ff1567e73a638ebaccdc263ae587206c860f4772792bd82ec6ddf414235fd evidence-run/site-results.zip | sha256sum -c -
      - name: Replay every downloadable exact native and legacy input
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import collections,hashlib,io,json,pathlib,subprocess,tarfile,time,zipfile
          out=pathlib.Path('evidence-run')
          z=zipfile.ZipFile(out/'site-results.zip'); assert z.testzip() is None
          site=json.loads(z.read('results.json'))
          assert site['meta']['git_revision']=='60654ab87757ee8b07e3a292fc546f18e8131a27'
          assert next(c for c in site['checkers'] if c['name']=='nucleus')['rev']=='cfbafd7531ce8e3d2e439e745c149d1b63ce8999'
          tests={t['name']:t for t in site['tests']}; prev={r['test']:r for r in site['results'] if r['checker']=='nucleus'}
          z=zipfile.ZipFile(out/'test-tarball.zip'); assert z.testzip() is None
          t=tarfile.open(fileobj=io.BytesIO(z.read('lean-arena-tests.tar.gz')))
          members=[m for m in t.getmembers() if m.isfile() and m.name.endswith('.ndjson')]
          assert len(members)==356
          rows=[]; changes=[]
          for m in members:
              raw=t.extractfile(m).read(); name=m.name.split('/',1)[1].removesuffix('.ndjson')
              digest=hashlib.sha256(raw).hexdigest(); assert digest==tests[name]['sha256'],name
              meta=json.loads(raw.splitlines()[0])['meta']
              start=time.monotonic()
              p=subprocess.run(['python3','arena.py'],input=raw,capture_output=True,timeout=120)
              row={'name':name,'sha256':digest,'format':meta['format']['version'],'lean':meta['lean']['githash'],'expected':tests[name]['outcome'],'official_previous_exit':prev[name]['exit_code'],'exit':p.returncode,'seconds':round(time.monotonic()-start,6),'stderr':p.stderr.decode(errors='replace'),'stdout':p.stdout.decode(errors='replace')}
              rows.append(row)
              if p.returncode!=prev[name]['exit_code']:changes.append(row)
              print('CORPUS '+json.dumps({'name':name,'exit':p.returncode,'previous':prev[name]['exit_code']}),flush=True)
              (out/'corpus-rows.json').write_text(json.dumps(rows,indent=2)+'\n')
          assert len({r['name'] for r in rows})==356
          counts=dict(collections.Counter(str(r['exit']) for r in rows))
          formats=dict(collections.Counter(r['format'] for r in rows))
          summary={'counts':counts,'formats':formats,'changed':changes,'input_count':len(rows)}
          (out/'corpus-summary.json').write_text(json.dumps(summary,indent=2)+'\n')
          print('CORPUS_SUMMARY '+json.dumps(summary),flush=True)
          assert not changes,'Frozen baseline drift'
          assert counts=={'0':30,'1':42,'2':284},counts
          PY
      - name: Enforce predeclared transport-only result
        if: always()
        run: |
          python3 - <<'PY'
          import json,pathlib
          p=pathlib.Path('evidence-run')
          r=json.loads((p/'new-regressions.json').read_text()); c=json.loads((p/'corpus-summary.json').read_text())
          assert len(r)==4 and [x['exit'] for x in r]==[2,2,1,2],r
          assert not c['changed'] and c['input_count']==356 and c['counts']=={'0':30,'1':42,'2':284},c
          print('Transport-only candidate: ERROR -> UNKNOWN; 356 exact verdicts preserved. Semantic completeness not established.')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nucleus-expression-order-candidate
          path: evidence-run/
          retention-days: 60
