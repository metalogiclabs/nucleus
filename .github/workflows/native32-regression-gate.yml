name: Nucleus complete ordinary native migration and protected regression gate
on:
  push:
    branches: [research/native32-ordinary-completion-20261127]
    paths: ['.github/workflows/native32-regression-gate.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.99.1'
      - name: Verify qualified runtime and build isolated native core candidate
        run: |
          set -euo pipefail
          mkdir -p evidence-run
          git rev-parse HEAD > evidence-run/commit.txt
          git rev-parse HEAD:src > evidence-run/source-tree.txt
          test "$(git rev-parse HEAD:src)" = 362242c265ee2b1758645c78ad141ad78bf6f8c2
          python3 scripts/verify_source_import.py
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/renovation.rs')
          s=p.read_text()
          def once(a,b):
              global s
              assert s.count(a)==1,(a,s.count(a))
              s=s.replace(a,b)
          once('collections::HashSet, io::','collections::{HashMap, HashSet}, io::')
          marker='fn telescope(exprs: &[Value], mut id: usize)'
          table=r'''// Expression IDs are identities, not stream ordinals. The export
          // may introduce a high-numbered node before a low-numbered one.
          // Keep dependency order independently and never allocate by max ID.
          #[derive(Default)]
          struct ExpressionTable {
              entries: HashMap<usize, (usize, Value)>,
          }
          impl ExpressionTable {
              fn insert(&mut self, id: usize, row: Value) -> Checked<()> {
                  let ordinal = self.entries.len();
                  if self.entries.contains_key(&id) { return Err("duplicate expression ID"); }
                  self.entries.insert(id, (ordinal, row));
                  Ok(())
              }
              fn get(&self, id: usize) -> Option<&Value> {
                  self.entries.get(&id).map(|(_, row)| row)
              }
              fn earlier(&self, child: usize, parent: usize) -> bool {
                  match (self.entries.get(&child), self.entries.get(&parent)) {
                      (Some((c, _)), Some((p, _))) => c < p,
                      _ => false,
                  }
              }
              // Preserve the predecessor's complete-ID-set requirement.
              // Only record order changes; sparse admission is not claimed.
              fn dense(&self) -> bool {
                  self.entries.keys().all(|id| *id < self.entries.len())
              }
          }
          
          '''
          once(marker,table+marker.replace('&[Value]','&ExpressionTable'))
          once('if domain >= id || body >= id {','if !exprs.earlier(domain, id) || !exprs.earlier(body, id) {')
          once('fn contains_family(exprs: &[Value],','fn contains_family(exprs: &ExpressionTable,')
          once('if child >= id { return Err("forward or cyclic expression edge"); }','if !exprs.earlier(child, id) { return Err("forward or cyclic expression edge"); }')
          once('fn check_block(block: &Value, exprs: &[Value],','fn check_block(block: &Value, exprs: &ExpressionTable,')
          once('let mut exprs = Vec::<Value>::new();','let mut exprs = ExpressionTable::default();')
          once('if integer(n)? != exprs.len() { return Err("nonconsecutive expression IDs"); }\n            exprs.push(row);','let id = integer(n)?;\n            exprs.insert(id, row)?;')
          once('    if whole_export.as_ref().is_some_and(|rows| nullary::admits(rows)) {','    if !exprs.dense() { return Err("missing expression IDs"); }\n    // Whole-export admission remains unchanged, including strict table checks.\n    if whole_export.as_ref().is_some_and(|rows| nullary::admits(rows)) {')
          marker='    #[test]\n    fn no_warrant_from_empty_or_malformed_new_input()'
          tests=r'''    #[test]
              fn expression_identity_and_dependency_order_are_distinct() {
                  let mut t = ExpressionTable::default();
                  let sort = |id:usize| serde_json::json!({"ie":id,"sort":0});
                  t.insert(2,sort(2)).unwrap();
                  t.insert(1,sort(1)).unwrap();
                  t.insert(0,serde_json::json!({"ie":0,"forallE":{"type":2,"body":1}})).unwrap();
                  assert!(t.dense());
                  assert!(t.earlier(2,0));
                  assert!(!t.earlier(0,2));
                  assert!(!t.earlier(2,2));
                  assert!(telescope(&t,0).is_ok());
                  assert!(t.insert(2,sort(2)).is_err());
                  let mut forward = ExpressionTable::default();
                  forward.insert(0,serde_json::json!({"ie":0,"forallE":{"type":2,"body":1}})).unwrap();
                  forward.insert(2,sort(2)).unwrap();
                  forward.insert(1,sort(1)).unwrap();
                  assert!(telescope(&forward,0).is_err());
              }
              #[test]
              fn unordered_table_is_not_admission_authority() {
                  let input = b"{\"ie\":1,\"sort\":0}\n{\"ie\":0,\"sort\":0}\n";
                  assert_eq!(check(std::io::Cursor::new(input),true),Ok(Outcome::Unknown));
                  let dup = b"{\"ie\":0,\"sort\":0}\n{\"ie\":0,\"sort\":0}\n";
                  assert!(check(std::io::Cursor::new(dup),true).is_err());
              }
          '''
          once(marker,tests+marker)
          p.write_text(s)
          PY
          python3 - <<'PY'
          from pathlib import Path
          def edit(path, changes):
              p=Path(path); s=p.read_text()
              for a,b in changes:
                  assert s.count(a)==1,(path,a,s.count(a))
                  s=s.replace(a,b)
              p.write_text(s)
          # Preserve the actual metadata, and keep the public legacy parser
          # restricted to version 3.1. The native route can only consume a
          # strict ordinary-declaration fragment selected by renovation.
          edit('src/parser.rs',[
              ('fn parse_meta(value: Value) -> Result<Meta, ParseError> {',
               'fn parse_meta(value: Value) -> Result<Meta, ParseError> {\n    parse_meta_version(value, "3.1.0")\n}\n\nfn parse_meta_version(value: Value, expected: &str) -> Result<Meta, ParseError> {'),
              ('if version != "3.1.0" {','if version != expected {'),
              ('impl ParsedExport {',r'''/// Native ordinary declarations, already structurally checked by the
          /// renovation envelope. No version relabeling or legacy inductive
          /// parsing is permitted, even if an internal caller is mistaken.
          pub(crate) fn parse_ordinary_native(
              meta_value: Value, rows: &[Value],
          ) -> Result<ParsedExport, ParseError> {
              let mut export = ParsedExport {
                  meta: parse_meta_version(meta_value, "3.2.0")?,
                  names: IdTable::default(),
                  levels: IdTable::default(),
                  exprs: IdTable::default(),
                  declarations: Vec::new(),
              };
              export.levels.insert(LevelId(0), Level::Zero)?;
              for (i, value) in rows.iter().enumerate() {
                  if value.get("in").is_none() && value.get("il").is_none()
                      && value.get("ie").is_none() && value.get("def").is_none()
                      && value.get("thm").is_none() {
                      return Err(malformed(i+2, "nonordinary native declaration"));
                  }
                  parse_record(&mut export, value.clone(), i+2)?;
              }
              if export.declarations.is_empty() || export.declarations.iter().any(|d|
                  !matches!(d, Declaration::Definition { .. } | Declaration::Theorem { .. })) {
                  return Err(ParseError::UnsupportedFormat("nonordinary native declaration".into()));
              }
              Ok(export)
          }

          impl ParsedExport {''')])
          edit('src/renovation/nullary.rs',[
              ('pub(super) fn projection_outcome(rows:&[Value])->Option<super::Outcome>{',r'''/// Reuse the existing typed core for an export containing only safe ordinary
          /// definitions and opaque theorems. All table records are checked by the
          /// strict reconstruction decoder, and all declarations are checked in
          /// source order by the independent core. In particular no axioms,
          /// primitive literals, projections, inductives or quotient semantics
          /// may cross this boundary. Unsupported syntax never supplies ACCEPT.
          pub(super) fn ordinary_outcome(rows:&[Value], meta:Value)->Option<super::Outcome>{
              use crate::verdict::Verdict;
              if rows.len()>MAX_RECORDS {return None;}
              let mut tables=Tables::new();
              let mut declarations=0usize;
              for row in rows {
                  let (item,is_def)=if keys(row,&["def"]) {
                      (row.get("def")?,true)
                  } else if keys(row,&["thm"]) {
                      (row.get("thm")?,false)
                  } else {
                      tables.add(row)?;
                      continue;
                  };
                  if is_def {
                      need(keys(item,&["all","hints","levelParams","name","safety","type","value"]))?;
                      need(item.get("safety")?.as_str()?=="safe")?;
                      let hints=item.get("hints")?;
                      need(matches!(hints.as_str(),Some("opaque"|"abbrev"))
                          || (keys(hints,&["regular"]) && num(hints,"regular").is_some()))?;
                  } else {
                      need(keys(item,&["all","levelParams","name","type","value"]))?;
                  }
                  let name=num(item,"name")?;
                  need(tables.valid_name(name) && numbers(item,"all")?==[name])?;
                  need(numbers(item,"levelParams")?.iter().all(|n|tables.valid_name(*n)))?;
                  need(num(item,"type")?<tables.exprs.len() && num(item,"value")?<tables.exprs.len())?;
                  declarations+=1;
              }
              need(declarations>0)?;
              let export=crate::parser::parse_ordinary_native(meta,rows).ok()?.resolve().ok()?;
              match crate::checker::check_export(export,crate::checker::Limits::default()) {
                  Verdict::Accept=>Some(super::Outcome::AcceptOrdinary),
                  Verdict::Reject=>Some(super::Outcome::Reject("ordinary-native-typing")),
                  Verdict::Unknown|Verdict::Error=>None,
              }
          }

          pub(super) fn projection_outcome(rows:&[Value])->Option<super::Outcome>{''')])
          edit('src/renovation.rs',[
              ('pub(crate) enum Outcome { AcceptReconstructed, Reject(&\'static str), Unknown }',
               'pub(crate) enum Outcome { AcceptReconstructed, AcceptOrdinary, Reject(&\'static str), Unknown }'),
              ('pub(crate) fn check<R: BufRead>(reader: R, verified_header: bool) -> Checked<Outcome> {',r'''pub(crate) fn check<R: BufRead>(reader:R, verified_header:bool)->Checked<Outcome>{
              check_inner(reader,verified_header,None)
          }

          pub(crate) fn check_native<R:BufRead>(reader:R,header:&str)->Checked<Outcome>{
              if !verified_header(header) {return Err("invalid native metadata");}
              let meta=unique_json::parse(header).map_err(|_|"invalid native metadata")?;
              if meta.pointer("/meta/format/version").and_then(Value::as_str)!=Some("3.2.0"){
                  return Err("not native 3.2 metadata");
              }
              check_inner(reader,true,Some(meta))
          }

          fn check_inner<R: BufRead>(reader: R, verified_header: bool, native_meta:Option<Value>) -> Checked<Outcome> {'''),
              ('    } else {\n        Ok(Outcome::Unknown)\n    }\n}\n\n#[cfg(test)]',
               '    } else if let Some(outcome)=whole_export.as_ref().and_then(|rows| native_meta.and_then(|meta|nullary::ordinary_outcome(rows,meta))) {\n        Ok(outcome)\n    } else {\n        Ok(Outcome::Unknown)\n    }\n}\n\n#[cfg(test)]')])
          edit('src/lib.rs',[
              ('        return match renovation::check(tail, verified_header) {',r'''        let result=if version.as_deref()==Some("3.2.0") {
                      renovation::check_native(tail,&header)
                  } else {
                      renovation::check(tail,verified_header)
                  };
                  return match result {
                      Ok(renovation::Outcome::AcceptOrdinary) => {
                          eprintln!("NUCLEUS_RENOVATION_ADMISSION: ordinary-native-core");
                          Verdict::Accept
                      }''')])
          PY
          python3 - <<'PY'
          from pathlib import Path
          def edit(path, changes):
              p=Path(path);s=p.read_text()
              for a,b in changes:
                  assert s.count(a)==1,(path,a,s.count(a))
                  s=s.replace(a,b)
              p.write_text(s)
          # Admit only dependent-form let records with nondep=false. The
          # complete typed core interprets their source type, value and body.
          # This extra table constructor is unavailable to earlier admission.
          edit('src/renovation/nullary.rs',[
              ('    Proj(usize, usize, usize),','    Proj(usize, usize, usize),\n    OrdinaryLet,'),
              ('    fn add_projection(&mut self,row:&Value)->Option<()> {',r'''    fn add_ordinary_let(&mut self,row:&Value)->Option<()> {
                  need(keys(row,&["ie","letE"]))?;
                  let id=num(row,"ie")?;
                  let p=row.get("letE")?;
                  need(keys(p,&["name","type","value","body","nondep"]))?;
                  need(id==self.exprs.len() && num(p,"name")?<self.names.len() && !boolean(p,"nondep")?)?;
                  need(num(p,"type")?<id && num(p,"value")?<id && num(p,"body")?<id)?;
                  self.exprs.push(Expr::OrdinaryLet);
                  Some(())
              }
              fn add_projection(&mut self,row:&Value)->Option<()> {'''),
              ('    let mut declarations=0usize;\n    for row in rows {','    let mut declarations=0usize;\n    let mut final_axiom=false;\n    for row in rows {\n        if final_axiom {return None;}'),
              ('        } else {\n            tables.add(row)?;\n            continue;\n        };',r'''        } else if keys(row,&["axiom"]) {
                      // A final axiom may be refuted as ill-formed. It may
                      // never authorize acceptance or any subsequent claim.
                      let a=row.get("axiom")?;
                      need(keys(a,&["isUnsafe","levelParams","name","type"]))?;
                      need(!boolean(a,"isUnsafe")? && tables.valid_name(num(a,"name")?))?;
                      need(numbers(a,"levelParams")?.iter().all(|n|tables.valid_name(*n)))?;
                      need(num(a,"type")?<tables.exprs.len())?;
                      final_axiom=true;
                      declarations+=1;
                      continue;
                  } else {
                      if keys(row,&["ie","letE"]) {tables.add_ordinary_let(row)?;}
                      else {tables.add(row)?;}
                      continue;
                  };'''),
              ('        Verdict::Accept=>Some(super::Outcome::AcceptOrdinary),','        Verdict::Accept if !final_axiom=>Some(super::Outcome::AcceptOrdinary),\n        Verdict::Accept=>None,')])
          edit('src/renovation/nullary/parametric.rs',[
              ('        Expr::Proj(n,i,s)=>Term::Proj(*n,*i,from_expr(t,*s,fuel,depth+1)?),',
               '        Expr::Proj(n,i,s)=>Term::Proj(*n,*i,from_expr(t,*s,fuel,depth+1)?),\n        Expr::OrdinaryLet=>return None,')])
          edit('src/parser.rs',[
              ('            && value.get("thm").is_none() {','            && value.get("thm").is_none() && value.get("axiom").is_none() {'),
              ('    if export.declarations.is_empty() || export.declarations.iter().any(|d|\n        !matches!(d, Declaration::Definition { .. } | Declaration::Theorem { .. })) {',
               '    if export.declarations.is_empty() || export.declarations.iter().enumerate().any(|(i,d)|\n        !matches!(d, Declaration::Definition { .. } | Declaration::Theorem { .. })\n        && !(i+1==export.declarations.len() && matches!(d, Declaration::Axiom { .. }))) {')])
          PY
          git diff --exit-code -- . ':!src/renovation.rs' ':!src/renovation/nullary.rs' ':!src/renovation/nullary/parametric.rs' ':!src/parser.rs' ':!src/lib.rs'
          git diff -- src > evidence-run/native32-candidate.patch
          git add src
          git write-tree > evidence-run/candidate-tree.txt
          git rev-parse :src/renovation.rs > evidence-run/candidate-blob.txt
          tar -czf evidence-run/candidate-source.tar.gz src
          python3 scripts/test.py
          python3 -m unittest discover -s tests_py
          cargo build --locked --release --features diagnostics
          sha256sum target/release/metatron-kernel arena.py arena-flags.json > evidence-run/binary-and-launcher.sha256
      - name: Execute original upstream soundness regression bytes
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,pathlib,subprocess,time,urllib.request
          out=pathlib.Path('evidence-run'); inputs=out/'new-inputs'; inputs.mkdir(exist_ok=True)
          G='https://raw.githubusercontent.com/jasisz/gruszka/66e5a93883b91f0cbf2b5f81924c4cdd03b60757/tests/adv/'
          P='https://raw.githubusercontent.com/jasisz/pestka/72162e89e5008ca405646ccebb2c0f685aed1d45/tests/soundness-findings/'
          cases=[
            (G+'good_cases_shape_keeps_ih.ndjson','198628397eb81df34f66f625584f825852209616',0),
            (G+'bad_cases_shape_keeps_ih.ndjson','fb396951a7003d50683267807c4d1290d20157f4',1),
            (G+'bad_nat_log2_by_name_31.ndjson','8733fbe8103b9134d0e6b4de4eb9a00ceb1488a1',1),
            (P+'nat-without-succ-ab.ndjson','35d342e958f879d1e9d272f9b138d51569e00f4b',1)]
          rows=[]
          for url,blob,expected in cases:
              raw=urllib.request.urlopen(url,timeout=30).read()
              assert hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\0'+raw).hexdigest()==blob,url
              name=url.rsplit('/',1)[1]; (inputs/name).write_bytes(raw)
              start=time.monotonic()
              p=subprocess.run(['python3','arena.py'],input=raw,capture_output=True,timeout=120)
              row={'case':name,'source':url,'git_blob':blob,'sha256':hashlib.sha256(raw).hexdigest(),'metadata':json.loads(raw.splitlines()[0]),'expected':expected,'exit':p.returncode,'seconds':round(time.monotonic()-start,6),'stdout':p.stdout.decode(errors='replace'),'stderr':p.stderr.decode(errors='replace')}
              rows.append(row)
              print('NEW_REGRESSION '+json.dumps(row),flush=True)
              (out/'new-regressions.json').write_text(json.dumps(rows,indent=2)+'\n')
          assert len(rows)==4
          # Do not hide incomplete or wrong results; final gate runs after corpus replay.
          PY
      - name: Retrieve immutable native export and official Nucleus receipts
        run: |
          set -euo pipefail
          gh api repos/leanprover/lean-kernel-arena-beta/actions/artifacts/15158040096/zip > evidence-run/test-tarball.zip
          gh api repos/leanprover/lean-kernel-arena-beta/actions/artifacts/15158072357/zip > evidence-run/site-results.zip
          printf '%s  %s\n' 1d0dafccc4d0248f191739751a836b67ceaf491f6b6e70410a3a52e5df690d4d evidence-run/test-tarball.zip bf8ff1567e73a638ebaccdc263ae587206c860f4772792bd82ec6ddf414235fd evidence-run/site-results.zip | sha256sum -c -
      - name: Replay every downloadable exact native and legacy input
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import collections,hashlib,io,json,pathlib,subprocess,tarfile,time,zipfile
          out=pathlib.Path('evidence-run')
          z=zipfile.ZipFile(out/'site-results.zip'); assert z.testzip() is None
          site=json.loads(z.read('results.json'))
          assert site['meta']['git_revision']=='60654ab87757ee8b07e3a292fc546f18e8131a27'
          assert next(c for c in site['checkers'] if c['name']=='nucleus')['rev']=='cfbafd7531ce8e3d2e439e745c149d1b63ce8999'
          tests={t['name']:t for t in site['tests']}; prev={r['test']:r for r in site['results'] if r['checker']=='nucleus'}
          z=zipfile.ZipFile(out/'test-tarball.zip'); assert z.testzip() is None
          t=tarfile.open(fileobj=io.BytesIO(z.read('lean-arena-tests.tar.gz')))
          members=[m for m in t.getmembers() if m.isfile() and m.name.endswith('.ndjson')]
          assert len(members)==356
          rows=[]; changes=[]
          for m in members:
              raw=t.extractfile(m).read(); name=m.name.split('/',1)[1].removesuffix('.ndjson')
              digest=hashlib.sha256(raw).hexdigest(); assert digest==tests[name]['sha256'],name
              meta=json.loads(raw.splitlines()[0])['meta']
              start=time.monotonic()
              p=subprocess.run(['python3','arena.py'],input=raw,capture_output=True,timeout=120)
              row={'name':name,'sha256':digest,'format':meta['format']['version'],'lean':meta['lean']['githash'],'expected':tests[name]['outcome'],'official_previous_exit':prev[name]['exit_code'],'exit':p.returncode,'seconds':round(time.monotonic()-start,6),'stderr':p.stderr.decode(errors='replace'),'stdout':p.stdout.decode(errors='replace')}
              rows.append(row)
              if p.returncode!=prev[name]['exit_code']:changes.append(row)
              print('CORPUS '+json.dumps({'name':name,'exit':p.returncode,'previous':prev[name]['exit_code']}),flush=True)
              (out/'corpus-rows.json').write_text(json.dumps(rows,indent=2)+'\n')
          assert len({r['name'] for r in rows})==356
          counts=dict(collections.Counter(str(r['exit']) for r in rows))
          formats=dict(collections.Counter(r['format'] for r in rows))
          summary={'counts':counts,'formats':formats,'changed':changes,'input_count':len(rows)}
          (out/'corpus-summary.json').write_text(json.dumps(summary,indent=2)+'\n')
          print('CORPUS_SUMMARY '+json.dumps(summary),flush=True)
          old={'accept':0,'reject':1}
          assert all(r['official_previous_exit']==2 and r['expected'] in old and r['exit']==old[r['expected']] for r in changes),changes
          selected={r['name']:r['exit'] for r in rows}
          assert selected['tutorial/001_basicDef']==0 and selected['tutorial/002_badDef']==1,selected
          PY
      - name: Test native core boundary and frozen prior cohort
        run: |
          set -euo pipefail
          gh api repos/heathsanchez/test/actions/artifacts/15053582604/zip > evidence-run/prior-qualification.zip
          printf '%s  %s\n' d8a2cb8b5c92bb14dea63fb019086e6c7f8a6b6183d804681f53a50fb8c145ee evidence-run/prior-qualification.zip | sha256sum -c -
          python3 - <<'PY'
          import hashlib,io,json,pathlib,subprocess,tarfile,zipfile
          p=pathlib.Path('evidence-run')
          def run(b):return subprocess.run(['python3','arena.py'],input=b,capture_output=True,timeout=120)
          z=zipfile.ZipFile(p/'test-tarball.zip')
