          m=next(m for m in t.getmembers() if m.name.endswith('/001_basicDef.ndjson'))
          good=t.extractfile(m).read()
          rows=[json.loads(l) for l in good.splitlines()]
          def mutate(f):
              x=json.loads(json.dumps(rows));f(x)
              return b''.join(json.dumps(r,separators=(',',':')).encode()+b'\n' for r in x)
          cases=[
              ('authentic',good,0),
              ('unsafe',mutate(lambda x:x[-1]['def'].update(safety='unsafe')),2),
              ('missing-type',mutate(lambda x:x[-1]['def'].update(type=100)),2),
