              ('unsupported-literal',mutate(lambda x:x.insert(-1,{'ie':2,'natVal':'0'})),2),
              ('valid-final-axiom',mutate(lambda x:x.extend([{'in':2,'str':{'pre':0,'str':'newAxiom'}},{'axiom':{'isUnsafe':False,'name':2,'levelParams':[],'type':0}}])),2),
              ('duplicate-expression',mutate(lambda x:x.insert(-1,dict(x[-2]))),3),
              ('duplicate-json-key',good.replace(b'"name":1,"safety"',b'"name":1,"name":1,"safety"'),3),
              ('forward-const',mutate(lambda x:(x.insert(-1,{'ie':2,'const':{'name':1,'us':[]}}),x[-1]['def'].update(value=2))),None),
          ]
          controls=[]
          for name,raw,expected in cases:
              q=run(raw); row={'case':name,'sha256':hashlib.sha256(raw).hexdigest(),'exit':q.returncode,'expected':expected,'stderr':q.stderr.decode(errors='replace')}
              controls.append(row);print('CONTROL '+json.dumps(row),flush=True)
              assert q.returncode==expected if expected is not None else q.returncode in (1,2),row
          (p/'boundary-controls.json').write_text(json.dumps(controls,indent=2)+'\n')
          old=zipfile.ZipFile(p/'prior-qualification.zip');assert old.testzip() is None
          prior={r['name']:r for r in json.loads(old.read('beta-rows.json'))}
          inner=zipfile.ZipFile(io.BytesIO(old.read('tarball.zip')));assert inner.testzip() is None
          tar=tarfile.open(fileobj=io.BytesIO(inner.read('lean-arena-tests.tar.gz')))
          old_rows=[];changes=[]
          for m in tar.getmembers():
              if not m.isfile() or not m.name.endswith('.ndjson'):continue
              name=m.name.split('/',1)[1].removesuffix('.ndjson')
              raw=tar.extractfile(m).read(); a=prior[name]; digest=hashlib.sha256(raw).hexdigest()
              assert digest==a['sha256'],name
              q=run(raw); row={'name':name,'sha256':digest,'format':a['format'],'expected':a['expected'],'old':a['raw_exit'],'new':q.returncode}
              old_rows.append(row)
              if q.returncode!=a['raw_exit']:changes.append(row)
              print('PRIOR '+json.dumps(row),flush=True)
          (p/'prior-rows.json').write_text(json.dumps(old_rows,indent=2)+'\n')
          assert len(old_rows)==356
          assert all(r['format']=='3.2.0' and r['old']==2 and r['expected'] in ('accept','reject') and r['new']=={'accept':0,'reject':1}[r['expected']] for r in changes),changes
          print('PRIOR_SUMMARY '+json.dumps({'count':len(old_rows),'changes':changes}),flush=True)
          current={r['name']:r for r in json.loads((p/'corpus-rows.json').read_text())}
          restored=[r['name'] for r in old_rows if r['old'] in (0,1) and current[r['name']]['official_previous_exit']==2 and current[r['name']]['exit']==r['old']]
          lost=[r['name'] for r in old_rows if r['old'] in (0,1) and current[r['name']]['official_previous_exit']==2]
          print('MIGRATION_RESTORATION '+json.dumps({'restored':restored,'lost':lost,'remaining':sorted(set(lost)-set(restored))}),flush=True)
          (p/'migration-restoration.json').write_text(json.dumps({'restored':restored,'lost':lost,'remaining':sorted(set(lost)-set(restored))},indent=2)+'\n')
          assert len(lost)==38 and set(restored)==set(lost), 'Migration is not fully restored'
          PY
